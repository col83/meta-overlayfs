[package]
name = "meta-overlayfs"
version = "1.3.2"
edition = "2024"
authors = ["KernelSU Developers"]
description = "An implementation of a metamodule using OverlayFS for KernelSU"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
hole-punch = { git = "https://github.com/tiann/hole-punch" }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { git = "https://github.com/Kernel-SU/rustix.git", rev = "4a53fbc7cb7a07cabe87125cc21dbc27db316259", features = ["all-apis"] }
procfs = "0.17"

[profile.release]
strip = true         # Remove debug symbols and reduce binary size.
opt-level = "z"      # Optimize aggressively for the smallest binary size.
lto = true           # Enable link-time optimization across compilation units.
codegen-units = 1    # Use one codegen unit for better optimization.
panic = "abort"      # Abort immediately on panic instead of unwinding.

